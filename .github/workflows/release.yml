name: Release

# Runs when a version tag (v1.0.0, v1.0.1, ...) is pushed. Builds the sdist and wheel, checks
# that the tag matches aircompkit.__version__, smoke-tests the wheel on three operating
# systems, publishes to PyPI with trusted publishing (no API token stored in the repository)
# and creates the GitHub release. Zenodo archives every GitHub release and mints a DOI once
# the repository is enabled at https://zenodo.org/account/settings/github/ (see RELEASING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/aircompkit/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the wheel into a clean environment
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Smoke test
        shell: bash
        run: |
          python -m aircompkit --version
          python -m aircompkit list
          python -m aircompkit reproduce yang2020 --quick --check

  pypi:
    needs: smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aircompkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: smoke   # independent of PyPI, so the Zenodo DOI is minted even if the upload fails
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "AirCompKit ${GITHUB_REF_NAME}" --notes-file <(awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md)
