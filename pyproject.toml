[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aircompkit"
dynamic = ["version"]
description = "Security-aware simulator for over-the-air computation and over-the-air federated learning."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "M. A. Moyeen" }, { name = "Kuljeet Kaur" }, { name = "Anjali Agarwal" }]
keywords = [
  "over-the-air computation", "AirComp", "federated learning", "wireless",
  "6G", "Byzantine robustness", "physical-layer security", "simulation",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Communications",
]
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.8", "types-PyYAML", "matplotlib>=3.7"]
docs = [
  "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25", "mkdocs-jupyter>=0.24",
  "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.7",
]
all = ["aircompkit[torch,plot]"]

[project.urls]
Repository = "https://github.com/moyeendev/AirCompKit"
Documentation = "https://moyeendev.github.io/AirCompKit/"
Changelog = "https://github.com/moyeendev/AirCompKit/blob/main/CHANGELOG.md"

[project.scripts]
aircompkit = "aircompkit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "aircompkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:hypothesispytest"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
